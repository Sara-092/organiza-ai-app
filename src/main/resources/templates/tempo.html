<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organiza Aí | Gerenciar tempo</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments :: menu}"></div>

<main class="container">
  <section class="page-heading">
    <span class="eyebrow">ORGANIZE SEU TEMPO</span>
    <h1>Gerenciar tempo</h1>
    <p>Use o cronômetro Pomodoro para acompanhar o tempo dedicado aos estudos.</p>
  </section>

  <section class="panel" style="max-width:900px;margin:32px auto;padding:20px;text-align:center">
    <a class="btn primary" href="https://pomodorotimer.online/pt" target="_blank" rel="noopener noreferrer">Abrir cronômetro em tela cheia ↗</a>

    <iframe
      src="https://pomodorotimer.online/pt"
      title="Pomodoro Timer"
      style="width:100%;height:650px;border:0;border-radius:12px;margin-top:20px;background:#fffefa"></iframe>

    <p class="muted" style="margin-top:14px">Se o quadro acima ficar em branco, use o botão para abrir o cronômetro em outra aba.</p>
  </section>
</main>

</body>
</html>
